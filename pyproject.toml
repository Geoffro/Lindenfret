[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lindenfret"
version = "0.1.0"
description = "L-system generator for playable variants of Villa-Lobos's Etude 1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["music21>=10", "mido>=1.3"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]

[project.scripts]
lindenfret = "lindenfret.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
