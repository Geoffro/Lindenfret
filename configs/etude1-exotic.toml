# Etude 1 with a wider palette: etude1.toml's chords plus added tones, altered
# dominants and polychords ("D|C" is D major over C major). The pattern, form
# and left-hand limits are etude1.toml's. See docs/design.md for each table.

[notation]
title = "Etude 1 variant, exotic harmony"             # the seed is added
direction = "hold every note to the end of the bar"   # written at the start

[meter]
time_signature = "4/4"
tempo = 120              # quarter notes per minute
repeat_bars = 2          # each generated bar is played twice
ritardando = 0.1         # the last bar pair of each section slows by this much, MIDI only

[pattern]                # Etude 1 right hand, confirmed by tools/analyze_reference.py
strings = [6, 4, 5, 3, 4, 2, 3, 1, 2, 1, 3, 2, 4, 3, 5, 4]
note = "16th"
# MIDI velocity per note: the reference's median in the bars that follow the pattern.
velocities = [126, 104, 102, 104, 102, 113, 102, 113, 102, 120, 90, 113, 102, 104, 102, 104]

[fretboard]
tuning = ["E2", "A2", "D3", "G3", "B3", "E4"]   # strings 6 to 1
max_span = 5             # highest fretted minus lowest fretted
max_fret = 13
max_fingers = 4
tension_strings = [1, 2]

[voicer]                 # soft preferences; the hard rules are in [fretboard]
comfortable_span = 3     # spans above this cost extra; the reference never exceeds 3
top_candidates = 8       # sample among this many of the best fingerings
temperature = 1.0        # 0 always takes the best; higher gives more variety
weights = { movement = 1.0, span = 2.0, open_strings = 0.5, doubling = 1.0 }

[centers]                # weights; "other" covers the remaining pitch classes
start = { E = 3, A = 3, D = 2, G = 2, B = 2, other = 1 }
start_mode = { minor = 3, major = 1 }
# Moves by a major third, keeping the mode, are twice as likely as in etude1.toml.
moves = { stay = 4, fifth_up = 2, fifth_down = 2, relative = 2, parallel = 1, third_up = 2, third_down = 2, semitone_up = 1, semitone_down = 1 }

[palette]
tonic = "E"                  # the chords are written in E and transposed to the current center
optional_intervals = [7]     # semitones above the root a voicing may leave out: the perfect fifth
minor = [
  # etude1.toml's: the chords of the reference's bars 1-22 and 47-54
  "Em", "F#m7b5/E", "B7/F#", "Em/G", "E/G#", "Am", "Em/B", "Bsus4", "B7", "F#7", "C#m7b5/G", "F#dim7",
  # Tonics: the open strings' Em7 add 11, minor-major seventh, sixth, and Em11 as D over Em
  "Em7 add 11", "EmM7", "Em6", "D|Em",
  # Over an E bass: Phrygian F. Then the reference's B-flat-bass chord from bars 13-16, B-flat E G D A
  "Fmaj7/E", "F|E", "Gm6 add 9/Bb",
  # Lydian and Dorian colors: D over C, C Lydian, G over Am, Am6
  "D|C", "Cmaj7 add #11", "G|Am", "Am6",
  # Altered dominants: flat ninth, sharp fifth, D over B (a sharp ninth), F over B (a tritone apart)
  "B7b9", "B7#5", "D|B", "F|B",
  # F7 as a tritone substitute for B7, and A#dim7 leading into B7
  "F7 add #11", "A#dim7",
]
major = [
  # etude1.toml's starting set
  "E", "A", "B7", "B7/F#", "C#m", "F#m7", "G#m7", "E/G#", "Am",
  # Tonics: sixth and ninth, added ninth, Lydian, F# over E (Lydian), B over E (a major ninth), D over E (Mixolydian)
  "E6 add 9", "Eadd9", "Emaj7 add #11", "F#|E", "B|E", "D|E",
  # Subdominants: B over A (Lydian), sixth and ninth, and the minor iv's sixth
  "B|A", "A6 add 9", "Am6",
  # Borrowed from minor: the flat sixth and flat third
  "Cmaj7", "Gmaj7",
  # Minor ninths on ii and vi
  "F#m9", "C#m9",
  # Dominants: thirteenth, flat ninth, sharp fifth, D over B (a sharp ninth), A over B (an eleventh)
  "B7 add 13", "B7b9", "B7#5", "D|B", "A|B",
  # A tritone substitute for B7
  "F7 add #11",
]

[graph]
# Weight of a chord change by how far the bass moves, in semitones. Against
# etude1.toml, a held bass (a pedal under changing colors) and a tritone count double.
bass_step = { 0 = 2, 1 = 4, 2 = 3, 3 = 2, 4 = 1, 5 = 1, 6 = 2 }
reference_bonus = 1      # added weight for chord changes the reference makes; half of etude1.toml's
reference_paths = [
  ["Em", "F#m7b5/E", "Em", "B7/F#", "Em/G", "E/G#", "Am"],   # bars 1-14
  ["Em/B", "Bsus4", "B7"],                                   # bars 17-22
  ["F#7", "C#m7b5/G", "F#dim7", "B7"],                       # bars 47-54
]

[form]
axiom = "S"
iterations = 1
rules.S = [
  { to = "A B A", weight = 3 },
  { to = "A B C A", weight = 1 },
]

[sections.A]             # chord changes in the lower positions, like bars 1-22
axiom = "F"
rules.F = [
  { to = "F[+F]F", weight = 2 },
  { to = "F[MF]F", weight = 1 },
  { to = "FMF", weight = 1 },
  { to = "FFK", weight = 1 },
]
length = [6, 12]         # bars before repetition
harmony = "graph"
region = "0-9"

[sections.B]             # planing, like bars 23-44
axiom = "F"
rules.F = [
  { to = "F-F", weight = 3 },
  { to = "F[-F]F", weight = 1 },
]
length = [6, 12]
harmony = "planing"
region = "0-12"          # the shape's start fret is drawn from here
shape_types = { dim7 = 3, augmented = 2, any = 1 }
open_strings = 2         # how many strings ring open; which ones is generated

[sections.C]             # chord changes higher up, like bars 47-54
axiom = "F"
rules.F = [
  { to = "FMF", weight = 2 },
  { to = "F[+F]F", weight = 1 },
  { to = "FK", weight = 1 },
]
length = [4, 8]
harmony = "graph"
region = "2-9"
