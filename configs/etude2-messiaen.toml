# Etude 2 in Messiaen's modes: every section draws its chords from a mode of
# limited transposition, so there is no palette or chord graph. The pattern,
# form and left-hand limits are etude2.toml's. See docs/design.md for each table.

[notation]
title = "Etude 2 variant, Messiaen modes"   # the seed is added
direction = "let ring"                      # written at the start

[meter]
time_signature = "4/4"
tempo = 126              # quarter notes per minute, as the reference starts
repeat_bars = 2          # each generated bar is played twice
ritardando = 0.1         # the last bar pair of each section slows by this much

[pattern]                # Etude 2 right hand, confirmed by tools/analyze_reference.py
contour = [0, 1, 2, 3, 4, 5, 6, 7, 8, 7, 6, 5, 4, 3, 2, 1]   # up a ladder of nine stops, back down to the second
note = "16th"
notes_per_string = 2     # the reference fits with at most two stops on a string
hand_positions = 2       # a bar may slide up to one new position as it climbs
max_slide = 3            # frets that slide may cover; the reference needs 3
# MIDI velocity per note: the reference's median in the bars that follow the contour.
velocities = [114, 114, 114, 114, 127, 114, 114, 114, 127, 114, 114, 114, 127, 114, 114, 114]

[fretboard]
tuning = ["E2", "A2", "D3", "G3", "B3", "E4"]   # strings 6 to 1
max_span = 4             # per hand position; the reference fits within 4
max_fret = 17            # the reference reaches A5 on string 1
max_fingers = 4
tension_strings = [1, 2]

[voicer]                 # soft preferences; the hard rules are in [fretboard] and [pattern]
comfortable_span = 3
top_candidates = 8
temperature = 1.0
# A nine-stop ladder over three to five pitch classes always doubles, so doubling costs nothing.
weights = { movement = 1.0, span = 2.0, open_strings = 0.5, doubling = 0.0, shift = 1.0 }

[centers]                # the first section's first degree, and how M moves it
start = { A = 3, E = 2, D = 2, other = 1 }
moves = { stay = 4, fifth_up = 2, fifth_down = 2, third_up = 1, third_down = 1, semitone_up = 1, semitone_down = 1 }

[modal]
# Every chord of these types, on any root, whose tones all lie in the mode.
# Augmented triads are left out: no nine-stop ladder fingers one. So are
# polychords: with "|", they would be over a third of mode 3's chords.
chord_types = ["", "m", "6", "7", "m7", "maj7", "9", "add9", "dim7", "m7b5", "7b5", "7#5", "7b9", "7#9"]
optional_intervals = [7]     # semitones above the root a voicing may leave out: the perfect fifth
# Weight of a chord change by how far the bass moves, in semitones: Etude 2's
# steps and fifths, and more minor thirds and tritones, which the modes repeat at.
bass_step = { 0 = 1, 1 = 3, 2 = 3, 3 = 2, 4 = 1, 5 = 3, 6 = 2 }

[form]
axiom = "S"
iterations = 1
rules.S = [
  { to = "A B A", weight = 3 },
  { to = "A B C A", weight = 1 },
]

[sections.A]             # the first degree and its neighbours, like bars 1-18
axiom = "F"
rules.F = [
  { to = "F[+F]F", weight = 2 },
  { to = "F[MF]F", weight = 1 },
  { to = "FHF", weight = 1 },
]
length = [6, 10]         # bars before repetition
harmony = "mode"
region = "0-12"
modes = { 2 = 3, 3 = 1 }  # weights

[sections.B]             # travelling, like the chain of fifths in bars 22-43
axiom = "F"
rules.F = [
  { to = "FMF", weight = 2 },
  { to = "F[MF]F", weight = 1 },
  { to = "FHF", weight = 1 },
]
length = [6, 12]
harmony = "mode"
region = "0-12"
modes = { 3 = 2, 7 = 1 }

[sections.C]             # higher up the neck, like bars 13-16
axiom = "F"
rules.F = [
  { to = "F[+F]F", weight = 1 },
  { to = "FMF", weight = 1 },
]
length = [4, 8]
harmony = "mode"
region = "5-17"
modes = { 6 = 1, 2 = 1 }
